name: keep-alive

# Solo manual. Antes corría cada 10 min: eso mantenía Render despierto las 24 h (~720 de las 750 horas gratuitas del
# mes, compartidas con los demás servicios de la cuenta) y Neon activo todo el mes. Ahora la demo duerme cuando
# nadie la usa y el primer visitante espera el arranque en frío (~1 min).
# Para presentar: ejecute este workflow (Actions > keep-alive > Run workflow) unos minutos antes. Un solo ping
# despierta Render y Neon; después el tráfico real los mantiene activos.
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  BASE_URL: https://kallpa-cacao.onrender.com

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Un 404 en la ruta pública también sirve: la consulta a la base se ejecutó. Un 5xx es un fallo real.
      # `|| true`: el shell de Actions corre con -e y un timeout de curl (código 28) abortaría antes de reintentar.
      - name: Despertar Render y Neon
        run: |
          for i in 1 2 3; do
            code=$(curl -s -o /dev/null -w "%{http_code}" -m 90 "$BASE_URL/api/v1/public/products/CAC001" || true)
            echo "Intento $i: HTTP $code"
            case "$code" in 200|404) exit 0 ;; esac
            sleep 10
          done
          echo "El servicio no respondió tras 3 intentos"
          exit 1
